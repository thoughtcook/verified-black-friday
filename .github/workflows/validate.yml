name: Validate data
on:
  push: {paths: ['data/**','scripts/**','README.md']}
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/validate.py
      - name: README is up to date
        run: python3 scripts/build.py && git diff --exit-code README.md data/deals.csv docs/index.html docs/sitemap.xml
