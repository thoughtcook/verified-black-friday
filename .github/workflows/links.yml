name: Link check
on:
  schedule: [{cron: '0 2 * * 1'}]
  workflow_dispatch:
jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --no-progress --max-retries 2 --accept 200,201,204,301,302,403,429 README.md data/deals.json
          fail: false
      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with: {title: 'Broken links found', content-filepath: ./lychee/out.md, labels: 'link-check'}
